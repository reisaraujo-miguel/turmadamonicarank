spring:
  application:
    name: turmadamonicarank
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
    username: ${SPRING_DATASOURCE_USERNAME:myuser}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enabled: false
  jackson:
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: true

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-only-secret-change-me-32b}
      issuer: turmadamonicarank
      audience: turmadamonicarank-web
      access-ttl: 10m
    auth:
      refresh-ttl: 30d
      confirmation-ttl: 24h
      reset-ttl: 1h
      refresh-cookie-secure: ${APP_REFRESH_COOKIE_SECURE:false}
  mail:
    from: ${APP_MAIL_FROM:Turma da Mônica Rank <no-reply@localhost>}
  rank:
    zone: ${APP_RANK_ZONE:America/Sao_Paulo}
