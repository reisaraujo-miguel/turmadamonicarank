services:
  postgres:
    image: 'postgres:18.6-alpine3.24'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myuser -d mydatabase']
      interval: 2s
      timeout: 3s
      retries: 20
  mailpit:
    image: 'axllent/mailpit:v1.27'
    ports:
      - '1025:1025'
      - '8025:8025'
